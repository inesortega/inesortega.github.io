---
layout: default
---
<div class="container container--cv">
  <header class="page-header">
    <div>
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
    </div>
    {% if page.download %}
    <a href="{{ page.download | relative_url }}" class="download-btn">↓ {{ page.download_label | default: 'Download' }}</a>
    {% endif %}
  </header>

  {{ content }}

  {% include site-footer.html %}
</div>
