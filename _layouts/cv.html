---
layout: default
---
<div class="container container--cv">
  <header class="page-header">
    <div>
      <h1>{{ page.title | default: 'Curriculum Vitae' }}</h1>
      <p class="subtitle">{{ site.author.name }}</p>
    </div>
    {% if page.pdf %}
    <a href="{{ page.pdf | relative_url }}" class="download-btn">↓ Download PDF</a>
    {% endif %}
  </header>

  {{ content }}

  {% include site-footer.html %}
</div>
