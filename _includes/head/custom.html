<!-- start custom head snippets -->

<!-- Favicon — teal "IO" monogram (SVG with PNG fallbacks) -->
<link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/images/favicon-32x32.png' | relative_url }}" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon.png' | relative_url }}">

<!-- Browser UI colour matches the top bar in light / dark -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e6f0f0">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a2425">

<!-- end custom head snippets -->
